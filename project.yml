name: CandyWrapper
options:
  bundleIdPrefix: dev.candywrapper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
  configs:
    # -Osize keeps the shipped bundle under the spec's 25 MB with room to spare (21.1 MB against 24.6 MB at -O
    # on 8739e4f) for benchmarks 2 to 8% slower (docs/perf/README.md, "Milestone 7 wrap-up").
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
packages:
  CandyKit:
    path: Packages/CandyKit
targets:
  CandyWrapper:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # T3's notification clips (apps/web/src/assets, MIT).
      - path: App/Resources/Sounds
        buildPhase: resources
    dependencies:
      - package: CandyKit
        product: DesignSystem
      - package: CandyKit
        product: T3Protocol
      - package: CandyKit
        product: T3Client
      - package: CandyKit
        product: T3Store
      - package: CandyKit
        product: Features
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: CandyWrapper
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSSupportsAutomaticGraphicsSwitching: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSQuitAlwaysKeepsWindows: true
        # T3 registers `t3code` (ElectronProtocol.ts:15-24). Debug builds use their own scheme so a
        # development build never takes the user's real T3 links from LaunchServices.
        CFBundleURLTypes:
          - CFBundleURLName: T3 Code
            CFBundleURLSchemes:
              - $(CANDY_URL_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.candywrapper.app
        ARCHS: "$(ARCHS_STANDARD)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          CANDY_URL_SCHEME: candywrapper-dev
        Release:
          ONLY_ACTIVE_ARCH: NO
          CANDY_URL_SCHEME: t3code

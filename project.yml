name: CandyWrapper
options:
  bundleIdPrefix: dev.candywrapper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
  configs:
    # -Osize keeps the shipped bundle under the spec's 25 MB with room to spare (21.1 MB against 24.6 MB at -O
    # on 8739e4f) for benchmarks 2 to 8% slower (docs/perf/README.md, "Milestone 7 wrap-up").
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
packages:
  CandyKit:
    path: Packages/CandyKit
  # The updater (docs/research/m9-updater-2026-10-11.md). The app is not sandboxed, so the build drops
  # Sparkle's XPC services below.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  CandyWrapper:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # T3's notification clips (apps/web/src/assets, MIT).
      - path: App/Resources/Sounds
        buildPhase: resources
      # Icon Composer icon, built like T3's assets/prod/app-icon.icon. actool also writes the flat
      # renditions and AppIcon.icns that macOS 14 and 15 show.
      - path: App/Resources/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: CandyKit
        product: DesignSystem
      - package: CandyKit
        product: T3Protocol
      - package: CandyKit
        product: T3Client
      - package: CandyKit
        product: T3Store
      - package: CandyKit
        product: Features
      - package: Sparkle
    postBuildScripts:
      # Sparkle's Installer and Downloader XPC services are for sandboxed apps only (B8), and the headers
      # are build-time files. The embed phase already signed the framework, so it is signed again after
      # the trim; the app's own signing comes after this phase. scripts/release re-signs all of it anyway.
      # The input is the embed's signature, the last thing the embed writes: without it Xcode ran this
      # script before the embed on rebuilds, so the copy put the trimmed files back or the signing hit a
      # half-copied bundle ("bundle format unrecognized").
      - name: Trim Sparkle
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/B/_CodeSignature
        script: |
          f="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          [ -d "$f" ] || exit 0
          rm -rf "$f/Versions/B/XPCServices" "$f/XPCServices" "$f/Versions/B/Headers" "$f/Headers" \
            "$f/Versions/B/PrivateHeaders" "$f/PrivateHeaders" "$f/Versions/B/Modules" "$f/Modules"
          /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime "$f/Versions/B"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: CandyWrapper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSSupportsAutomaticGraphicsSwitching: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSQuitAlwaysKeepsWindows: true
        # Sparkle (B6, B7): one signed feed on the `appcast` release of Sowyu/CandyWrapper, checked hourly,
        # nothing downloads until the user asks (T3's autoDownload false, DesktopUpdates.ts:933-934). An empty
        # feed URL turns the updater off, as T3 does for development builds (DesktopUpdates.ts:258-273).
        SUFeedURL: $(CANDY_UPDATE_FEED_URL)
        SUPublicEDKey: $(CANDY_UPDATE_PUBLIC_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        # T3 registers `t3code` (ElectronProtocol.ts:15-24). Debug builds use their own scheme so a
        # development build never takes the user's real T3 links from LaunchServices.
        CFBundleURLTypes:
          - CFBundleURLName: T3 Code
            CFBundleURLSchemes:
              - $(CANDY_URL_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.candywrapper.app
        ARCHS: "$(ARCHS_STANDARD)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "43"
        CANDY_UPDATE_PUBLIC_KEY: "3lPqUDTLuxLA+rq4R0InFIoN6hun/6vy1ElXcGaTnqA="
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          CANDY_URL_SCHEME: candywrapper-dev
          # Off in development builds; a test build passes a local feed and a test key on the command line.
          CANDY_UPDATE_FEED_URL: ""
        Release:
          ONLY_ACTIVE_ARCH: NO
          CANDY_URL_SCHEME: t3code
          CANDY_UPDATE_FEED_URL: https://github.com/Sowyu/CandyWrapper/releases/download/appcast/appcast.xml
